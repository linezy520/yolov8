# YOLOv8s-Wavelet — Route 2: Learnable Frequency-Domain Wavelet Filtering
# Stem layer (0) replaced by DWTFilterStem in training script.
# Conv placeholder used here for correct channel tracking during YAML parsing.
#
# Architecture:
#   Layer 0: DWTFilterStem (Haar DWT → 4 subbands → Conv fusion → SE attention)
#            ↓ The training script swaps the placeholder Conv for DWTFilterStem.
#            ↓ Both output [B, 32, H/2, W/2] → shape-compatible with downstream.
#   Layer 1-22: Standard YOLOv8s FPN+PAN + Detect head
#
# Channel plan: YOLOv8s-equivalent (depth=0.33, width=0.50, max_ch=1024)
# nc=4: ['Broken', 'Flashover damage', 'No issues', 'String']

nc: 4

# ---- Backbone ----
backbone:
  # [from, repeats, module, args]
  # P1/2 — ★ Placeholder: swapped to DWTFilterStem(3, 32) at runtime
  - [-1, 1, Conv, [32, 3, 2]]           # 0
  # P2/4
  - [-1, 1, Conv, [64, 3, 2]]           # 1
  - [-1, 1, C2f, [64, True]]            # 2
  # P3/8
  - [-1, 1, Conv, [128, 3, 2]]          # 3
  - [-1, 2, C2f, [128, True]]           # 4
  # P4/16
  - [-1, 1, Conv, [256, 3, 2]]          # 5
  - [-1, 2, C2f, [256, True]]           # 6
  # P5/32
  - [-1, 1, Conv, [512, 3, 2]]          # 7
  - [-1, 1, C2f, [512, True]]           # 8
  - [-1, 1, SPPF, [512, 5]]            # 9

# ---- Head/Neck ----
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11  cat backbone P4 → 768
  - [-1, 1, C2f, [256]]                           # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14  cat backbone P3 → 384
  - [-1, 1, C2f, [128]]                           # 15  P3/8-small
  - [-1, 1, Conv, [128, 3, 2]]                   # 16
  - [[-1, 12], 1, Concat, [1]]                    # 17  cat head P4 → 384
  - [-1, 1, C2f, [256]]                           # 18  P4/16-medium
  - [-1, 1, Conv, [256, 3, 2]]                   # 19
  - [[-1, 9], 1, Concat, [1]]                     # 20  cat backbone P5 → 768
  - [-1, 1, C2f, [512]]                           # 21  P5/32-large
  - [[15, 18, 21], 1, Detect, [nc]]               # 22  Detect(P3, P4, P5)
